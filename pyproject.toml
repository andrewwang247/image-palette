[project]
name = "image-palette"
version = "0.1.0"
description = "Extract color palettes representative of the dominant hues in an image."
authors = [{ name = "Andrew Wang", email = "siweiw9@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "colour-science",
    "click",
    "jinja2",
    "kneed",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["mypy", "pandas-stubs", "ruff", "pytest", "types-tqdm"]

[project.urls]
Repository = "https://github.com/andrewwang247/image-palette"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "S101", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["kneed", "sklearn.cluster"]
ignore_missing_imports = true

[tool.pytest]
addopts = ["-ra", "--strict-markers"]
testpaths = ["test"]
